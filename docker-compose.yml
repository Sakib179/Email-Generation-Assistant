services:
  postgres:
    image: postgres:16-alpine
    container_name: email-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: email_assistant
      POSTGRES_USER: email_assistant
      POSTGRES_PASSWORD: email_assistant_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

